<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="spartanRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1E27" />
      <stop offset="50%" stop-color="#E50914" />
      <stop offset="100%" stop-color="#800000" />
    </linearGradient>
    <linearGradient id="metallicDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2A2A38" />
      <stop offset="100%" stop-color="#0F0F17" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Cyber Shield / Crest Border -->
  <polygon points="250,20 440,110 440,350 250,480 60,350 60,110" fill="url(#metallicDark)" stroke="url(#spartanRed)" stroke-width="8" filter="url(#glow)"/>
  
  <!-- Red Spartan Helmet Crest forming 'S' curve -->
  <!-- Top Crest Plume -->
  <path d="M 250 50 C 320 50 390 90 390 150 C 390 200 330 230 250 250 C 170 270 120 300 120 360 C 120 420 190 450 250 450 C 300 450 350 430 380 400 L 360 360 C 330 385 290 400 250 400 C 200 400 170 380 170 350 C 170 320 220 295 300 275 C 370 255 430 215 430 150 C 430 75 350 15 250 15 C 190 15 130 40 90 80 L 120 120 C 155 90 200 50 250 50 Z" fill="url(#spartanRed)" />
  
  <!-- Cheekguard & Eye Slit (Futuristic visor) -->
  <polygon points="180,180 320,180 290,210 210,210" fill="#FFFFFF" opacity="0.9" filter="url(#glow)"/>
  
  <!-- Center Helmet Nose Guard -->
  <path d="M 250 210 L 265 310 L 250 340 L 235 310 Z" fill="url(#spartanRed)" />
</svg>
